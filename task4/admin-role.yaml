apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: admin-pods-secrets
  labels:
    role: admin
    purpose: pods-and-secrets-management
rules:
# Полный доступ к Pods (создание, чтение, обновление, удаление)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
# Полный доступ к Pods/log (чтение логов)
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list", "watch"]

# Полный доступ к Pods/exec (выполнение команд внутри контейнера)
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]

# Полный доступ к Secrets
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Доступ к ServiceAccounts (чтобы можно было создавать сервисные аккаунты для подов)
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Доступ к ConfigMaps (часто используются вместе с подами и секретами)
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Доступ к Namespaces (чтобы видеть, в каких пространствах работают поды)
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]

# Доступ к событиям (полезно для отладки подов)
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-pods-secrets-binding
subjects:
- kind: User
  name: admin
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: admin-pods-secrets
  apiGroup: rbac.authorization.k8s.io